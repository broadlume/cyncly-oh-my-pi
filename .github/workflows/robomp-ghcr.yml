name: robomp-ghcr

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.robomp"
      - "Dockerfile*.dockerignore"
      - "python/robomp/**"
      - "packages/**"
      - "crates/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/robomp-ghcr.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA=$(git rev-parse --short HEAD)
          echo "pi=ghcr.io/${OWNER}/pi:${SHA}" >> "$GITHUB_OUTPUT"
          echo "robomp=ghcr.io/${OWNER}/robomp:${SHA}" >> "$GITHUB_OUTPUT"
          echo "robomp_latest=ghcr.io/${OWNER}/robomp:latest" >> "$GITHUB_OUTPUT"

      - name: Build + push pi runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.pi }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push robomp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.robomp
          push: true
          tags: |
            ${{ steps.meta.outputs.robomp }}
            ${{ steps.meta.outputs.robomp_latest }}
          build-args: |
            PI_BASE=${{ steps.meta.outputs.pi }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
