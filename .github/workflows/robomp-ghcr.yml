name: robomp-ghcr

on:
  workflow_dispatch:
    inputs:
      omp_version:
        description: "Upstream omp release tag, e.g. v17.3.1; empty = Dockerfile default"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "Dockerfile.robomp"
      - "Dockerfile.robomp.dockerignore"
      - "python/robomp/**"
      - "python/omp-rpc/**"
      - ".github/workflows/robomp-ghcr.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA=$(git rev-parse --short HEAD)
          echo "robomp=ghcr.io/${OWNER}/robomp:${SHA}" >> "$GITHUB_OUTPUT"
          echo "robomp_latest=ghcr.io/${OWNER}/robomp:latest" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.omp_version }}" ]; then
            echo "build_args=OMP_VERSION=${{ inputs.omp_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "build_args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + push robomp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.robomp
          push: true
          tags: |
            ${{ steps.meta.outputs.robomp }}
            ${{ steps.meta.outputs.robomp_latest }}
          build-args: ${{ steps.meta.outputs.build_args }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
